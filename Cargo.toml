[package]
name = "dotquad"
version = "0.1.1-rc.1"
edition = "2024"
rust-version = "1.85"
description = "IP lookup, DNS, WHOIS and domain checks from the terminal, using the Dotquad API."
license = "MIT"
authors = ["BinaryNoir Studios"]
repository = "https://github.com/dotquad/cli"
homepage = "https://dotquad.app"
readme = "README.md"
keywords = ["ip", "dns", "whois", "geolocation", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.12"
etcetera = "0.11.0"
percent-encoding = "2.3.2"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
ureq = "3.5.2"

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
