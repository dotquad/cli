[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew tap the formula is published to
tap = "dotquad/homebrew-tap"
# Publish the Homebrew formula and the npm package on each release
publish-jobs = ["homebrew", "npm"]
# The npm package: `npm install -g dotquad`
npm-package = "dotquad"
# release.yml is edited by hand, so put these back after `dist generate`:
# - the npm job uses Trusted Publishing (OIDC, no NPM_TOKEN)
# - `gh release create` has no --target: with it, GitHub refused the Actions token (HTTP 403)
allow-dirty = ["ci"]
# Extra files in each archive
include = ["TRADEMARKS.md"]
